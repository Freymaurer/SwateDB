name: Ontology CI

on:
  workflow_call:
    inputs:
      java_version:
        description: 'Java version to use'
        required: false
        type: string
        default: '17'
      working_directory:
        description: 'Directory containing .swatedb.yml'
        required: false
        type: string
        default: '.'

jobs:
  validate:
    name: Validate ontology files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Install ci-tools
        run: npm install @swatedb/ci-tools

      - name: Validate ontologies
        run: npx swatedb-ci validate-all --config ${{ inputs.working_directory }}/.swatedb.yml
        working-directory: ${{ inputs.working_directory }}
