name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        java-version: [17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Build Java parser with Maven
        run: |
          if [ -f packages/java-parser/pom.xml ]; then
            cd packages/java-parser
            mvn -q clean package -DskipTests
          else
            echo "Skipping Maven build: packages/java-parser/pom.xml not present yet."
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        env:
          JAVA_BRIDGE_JAR_PATH: ${{ github.workspace }}/packages/java-parser/target/java-parser-0.1.0-all.jar
        run: npm run test
