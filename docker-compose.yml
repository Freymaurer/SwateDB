services:
  neo4j:
    image: neo4j:5-community
    container_name: swatedb-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  redis:
    image: redis:7-alpine
    container_name: swatedb-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: swatedb-backend
    depends_on:
      - neo4j
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: swatedb-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  neo4j-data:
